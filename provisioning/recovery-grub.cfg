# Self-contained EFI loader: rescue does not depend on the installed root.
# Escape during this short window reveals the recovery menu.
set timeout_style=hidden
set timeout=1
set fallback=1
set color_normal=light-gray/black
set color_highlight=black/light-cyan
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-cyan
load_env -f ($root)/companion/recovery/grubenv
if [ "$companion_pending" = 1 ]; then
    set default=1
else
    set default=0
fi
menuentry 'Companion management - stable' {
    echo 'COMPANION | Starting management'
    set companion_pending=1
    save_env -f ($root)/companion/recovery/grubenv companion_pending
    linux /companion/stable/vmlinuz-lts root=UUID=@ROOT_UUID@ rootfstype=ext4 modules=sd-mod,usb-storage,ext4,nvme,vmd console=ttyS0,115200n8 console=tty1 panic=15 quiet loglevel=4
    initrd /companion/stable/initramfs-lts
}
menuentry 'Companion internal rescue - Ethernet root access' {
    echo 'COMPANION | Starting recovery'
    linux /boot/vmlinuz-lts modules=loop,squashfs,sd-mod,usb-storage,nvme,vmd console=ttyS0,115200n8 console=tty1 panic=15
    initrd /boot/intel-ucode.img /boot/initramfs-lts
}
