<!doctype html><html lang="en"><meta charset="utf-8"><title>Companion Browser</title>
<style>body{background:#0b1018;color:#f0f5ff;font:22px system-ui;margin:10vh auto;max-width:850px;padding:32px}h1{color:#50e1be}input,button{font:inherit;padding:16px;border:0;border-radius:8px}input{width:65%}button{background:#50e1be}p{color:#90a1b8;line-height:1.6}</style>
<h1>Companion Browser</h1><p>Your browser is ready. Enter a web address or search below.</p>
<form id="search"><input id="query" aria-label="Address or search" placeholder="Website or search" autofocus><button>Go</button></form>
<p>Alt+Tab switches applications. Windows+D returns to Companion. The Keyboard application provides touch text entry.</p>
<script>document.querySelector('form').onsubmit=e=>{e.preventDefault();let q=document.querySelector('input').value.trim();if(!q)return;location.href=/^https?:\/\//i.test(q)?q:/^[a-z0-9.-]+\.[a-z]{2,}(\/.*)?$/i.test(q)?'https://'+q:'https://duckduckgo.com/?q='+encodeURIComponent(q)}</script></html>
